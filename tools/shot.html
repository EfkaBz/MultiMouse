<!doctype html>
<!-- Staging page for README screenshots: the real UI in an iframe, fed with demo data. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  :root { --back: linear-gradient(140deg, #dfe9fb 0%, #ece6fb 55%, #f7e3f1 100%); --edge: rgba(0,0,0,.12); }
  @media (prefers-color-scheme: dark) {
    :root { --back: linear-gradient(140deg, #10131c 0%, #171528 55%, #22142a 100%); --edge: rgba(255,255,255,.12); }
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--back); display: grid; place-items: center; overflow: hidden; }
  .win {
    width: 1060px; height: 700px; border-radius: 14px; overflow: hidden;
    box-shadow: 0 40px 90px rgba(10, 10, 40, .35), 0 0 0 1px var(--edge);
  }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<div class="win"><iframe id="app" src="../multimouse/ui/index.html"></iframe></div>
<script>
const q = new URLSearchParams(location.search);
const role = q.get("role") || "server";
const base = {
  version: "1.0.8", os: q.get("os") || "windows", id: "pc", name: "PC Bureau", code: "K7M4QX", port: 24800,
  server_host: "", clipboard: true, swap_ctrl_cmd: true, speed: 1.2, role, permissions: null,
  language: q.get("lang") || "auto", lang: q.get("lang") || "fr",
};
const server = {
  ...base, error: "", connected: 2, ips: ["192.168.1.20"],
  nodes: [
    { id: "pc", name: "PC Bureau", w: 7280, h: 1440, os: "windows", x: 0, y: 0, online: true, me: true, active: false,
      monitors: [{ x: 0, y: 170, w: 1920, h: 1080 }, { x: 1920, y: 0, w: 3440, h: 1440 }, { x: 5360, y: 234, w: 1920, h: 1080 }] },
    { id: "mbp", name: "MacBook Pro", w: 1800, h: 1169, os: "mac", x: 1950, y: -1169, online: true, me: false,
      active: true, addr: "192.168.1.31", monitors: [] },
    { id: "laptop", name: "PC Portable", w: 1920, h: 1080, os: "windows", x: 3770, y: -1080, online: true, me: false,
      active: false, addr: "192.168.1.42", monitors: [] },
  ],
};
const client = {
  ...base, id: "mbp", name: "MacBook Pro", os: "mac", permissions: { accessibility: true, input: true },
  status: "connected", server_name: "PC Bureau", server_addr: "192.168.1.20", active: true,
  servers: [{ addr: "192.168.1.20", name: "PC Bureau", port: 24800 }],
  screen: { w: 1800, h: 1169, monitors: [] },
};
// theme=light|dark: drop the other scheme's rules so the result does not depend on the OS setting
function forceTheme(doc, theme) {
  for (const sheet of doc.styleSheets) {
    const rules = sheet.cssRules;
    for (let i = rules.length - 1; i >= 0; i--) {
      const r = rules[i];
      // not instanceof: the iframe has its own CSSMediaRule class
      if (!r.media || !/prefers-color-scheme/.test(r.media.mediaText)) continue;
      if (theme === "light") sheet.deleteRule(i);  // dark: Chrome runs with --force-dark-mode
      else { const css = [...r.cssRules].map((x) => x.cssText).join("\n"); sheet.deleteRule(i); sheet.insertRule(`@media all { ${css} }`, i); }
    }
  }
}
const theme = q.get("theme") === "light" ? "light" : null;
if (theme) forceTheme(document, theme);
document.getElementById("app").addEventListener("load", (e) => {
  const w = e.target.contentWindow;
  if (theme) forceTheme(w.document, theme);
  w.mm.update(role === "server" ? server : client);
  const view = q.get("view");
  if (view) w.document.querySelector(`[data-view="${view}"]`).click();
});
</script>
</body>
</html>
